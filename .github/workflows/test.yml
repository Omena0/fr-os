name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            qemu-system-x86 \
            python3 \
            python3-pip \
            genisoimage \
            mtools \
            grub-pc-bin \
            xorriso

      - name: Build and run checks
        run: make check
